<!doctype html>
<html><head><meta charset="utf-8"><title>Software Engineer at Globex</title>
<style>.opts{border:1px solid #999}.opts div{padding:4px;cursor:pointer}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style></head>
<body>
<h1>Software Engineer</h1><p>Globex - Bengaluru, India</p>
<input type="search" aria-label="Search jobs" placeholder="Search">
<form id="app" method="post" action="/submit" enctype="multipart/form-data">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
  <div><label for="resume">Resume/CV *</label><button type="button">Attach</button><input class="vh" id="resume" name="resume" type="file" accept=".pdf" required></div>
  <div><label for="cover">Cover Letter</label><input class="vh" id="cover" name="cover_letter" type="file"></div>
  <label for="li">LinkedIn Profile</label><input id="li" name="linkedin" type="url">
  <label for="gh">GitHub URL</label><input id="gh" name="github" type="url">
  <label for="yoe">Years of experience *</label><input id="yoe" name="yoe" type="number" required>
  <label for="auth">Are you legally authorized to work in India? *</label>
  <select id="auth" name="auth" required><option value="">Select...</option><option value="1">Yes</option><option value="0">No</option></select>
  <label id="spl">Will you now or in the future require sponsorship? *</label>
  <div><input id="sp" role="combobox" aria-labelledby="spl" aria-required="true" autocomplete="off"><input type="hidden" name="sponsorship" id="sp_val"><div id="sp_opts" class="opts" hidden></div></div>
  <fieldset><legend>Gender</legend>
    <label><input type="radio" name="gender" value="m"> Male</label>
    <label><input type="radio" name="gender" value="f"> Female</label>
    <label><input type="radio" name="gender" value="d"> Decline to self-identify</label>
  </fieldset>
  <label for="why">Why do you want to work at Globex? *</label><textarea id="why" name="why" required></textarea>
  <label><input type="checkbox" name="consent" value="yes" required> I agree to the Privacy Policy *</label>
  <label><input type="checkbox" name="marketing" value="yes"> Send me job alerts and marketing emails</label>
  <div id="err"></div>
  <button id="go" type="submit">Submit Application</button>
</form>
<script>
  const mode = new URLSearchParams(location.search).get('mode');
  const sp = document.getElementById('sp'), opts = document.getElementById('sp_opts');
  const show = () => { opts.hidden = false; opts.innerHTML = ''; for (const o of ['Yes', 'No']) { if (sp.value && !o.toLowerCase().startsWith(sp.value.toLowerCase())) continue; const d = document.createElement('div'); d.setAttribute('role', 'option'); d.textContent = o; d.onmousedown = (e) => { e.preventDefault(); sp.value = o; document.getElementById('sp_val').value = o; opts.hidden = true; }; opts.appendChild(d); } };
  sp.addEventListener('click', show); sp.addEventListener('input', show);
  sp.addEventListener('keydown', (e) => { if (e.key === 'Escape') { opts.hidden = true; sp.value = document.getElementById('sp_val').value; } });
  if (mode === 'multistep') document.getElementById('go').outerHTML = '<button type="button">Next</button>';
  document.getElementById('app').addEventListener('submit', (e) => {
    if (mode === 'invalid') { e.preventDefault(); document.getElementById('err').innerHTML = '<div class="field-error" role="alert">Please enter a valid phone number</div>'; }
    if (mode === 'silent') { e.preventDefault(); }
  });
</script>
</body></html>
