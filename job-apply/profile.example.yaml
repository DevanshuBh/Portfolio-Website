# Copy to profile.yaml and fill in. These are the facts the tool types into application forms.
# Anything left empty is never guessed: a required question without an answer stops that application
# and marks it "needs_manual".

first_name: ""
last_name: ""
preferred_name: ""
email: ""
phone: ""                 # include country code, e.g. +91 98765 43210
address: ""
city: ""
state: ""
country: ""
postal_code: ""
linkedin: ""
github: ""
portfolio: ""
current_company: ""
current_title: ""
years_of_experience: ""   # e.g. "2"
notice_period: ""         # e.g. "30 days"
current_ctc: ""           # e.g. "12 LPA"
expected_ctc: ""          # e.g. "18 LPA"
earliest_start_date: ""
highest_education: ""     # e.g. "B.Tech, Computer Science"
university: ""
graduation_year: ""
willing_to_relocate: ""   # Yes / No
work_authorization: ""    # free text, e.g. "Indian citizen; authorised to work in India"
authorized_countries: []  # countries where you may work without sponsorship, e.g. ["India"]
requires_sponsorship: ""  # Yes / No  (asked as "will you now or in the future require sponsorship?")
how_did_you_hear: "Company careers page"

# Voluntary self-identification questions. Leave empty to answer "Decline to self-identify" where offered.
gender: ""
race_ethnicity: ""
veteran_status: ""
disability_status: ""
pronouns: ""

# Tick required "I agree to the privacy policy / consent to data processing" boxes.
accept_privacy_consent: true

# Your own answers to recurring questions. `match` is a case-insensitive regular expression tested
# against the question text; the first match wins and is used verbatim. Checked before anything else.
answers:
  # - match: "why (do you want|are you interested)"
  #   answer: "..."
  # - match: "have you (ever )?(worked|been employed) (at|for|with)"
  #   answer: "No"
